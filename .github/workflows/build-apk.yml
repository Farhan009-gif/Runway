
name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Restore or create permanent debug keystore
        run: |
          mkdir -p .github/keys
          if [ ! -f .github/keys/debug.keystore ]; then
            if [ -f debug.keystore ]; then
              cp debug.keystore .github/keys/debug.keystore
            else
              keytool -genkeypair -v -keystore .github/keys/debug.keystore \
                -storepass android -alias androiddebugkey -keypass android \
                -keyalg RSA -keysize 2048 -validity 10000 \
                -dname "CN=Android Debug,O=Android,C=US"
            fi
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add .github/keys/debug.keystore
            git commit -m "build: store permanent debug keystore"
            git push
          fi
          cp .github/keys/debug.keystore debug.keystore

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Runway-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
