name: Build APK
on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Prepare signing key
        env:
          DEBUG_KEYSTORE_B64: ${{ secrets.DEBUG_KEYSTORE_B64 }}
        run: |
          USED=temp
          if [ -n "$DEBUG_KEYSTORE_B64" ]; then
            echo "$DEBUG_KEYSTORE_B64" | tr -d ' \r\n' | base64 -d > debug.keystore 2>/dev/null || true
            if keytool -list -keystore debug.keystore -storepass android >/dev/null 2>&1; then USED=secret; fi
          fi
          if [ "$USED" = temp ]; then
            echo "::warning::No valid DEBUG_KEYSTORE_B64 secret, using a temporary key. This APK cannot update an app signed with a different key."
            rm -f debug.keystore
            keytool -genkeypair -keystore debug.keystore \
              -storepass android -alias androiddebugkey -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi
          echo "Signing key: $USED"

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Runway-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
